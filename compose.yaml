services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: landex
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landex"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - landex-postgres-data:/var/lib/postgresql/data

volumes:
  landex-postgres-data:
